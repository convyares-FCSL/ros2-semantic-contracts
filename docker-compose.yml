services:
  harness:
    build:
      context: .
      dockerfile: docker/Dockerfile.harness
      args:
        - ROS_BASE_IMAGE=${ROS_BASE_IMAGE:-ros:jazzy-ros-base-noble@sha256:af9454f13d342c58bb9f3364424e3e7026184e59a47de75f915d241cb7ec6666}
        - ROS_DISTRO=${ROS_DISTRO:-jazzy}
    # Backend selection via ORACLE_BACKEND env var:
    #   prod - C++ rclcpp backend (default for Track 1)
    #   py   - Python rclpy backend (Track 2 probe)
    #   ros  - Rust backend (legacy)
    #   stub - Deterministic stub (smoke tests)
    environment:
      - ORACLE_BACKEND=${ORACLE_BACKEND:-prod}
      - CARGO_TERM_PROGRESS_WHEN=never
      - CARGO_TERM_COLOR=never
    volumes:
      - ./evidence:/evidence
      - ./.docker-cache/${ROS_DISTRO:-jazzy}/cargo-registry:/root/.cargo/registry
      - ./.docker-cache/${ROS_DISTRO:-jazzy}/cargo-git:/root/.cargo/git
      - ./.docker-cache/${ROS_DISTRO:-jazzy}/target-core:/work/harness/core/target
      - ./.docker-cache/${ROS_DISTRO:-jazzy}/target-stub:/work/harness/backends/backend_stub/target
    command: bash -lc "cd harness && ./scripts/run_harness.sh ${SCENARIO_BUNDLE:-scenarios/scenarios_H.json} ${TRACE:-/evidence/trace.jsonl} ${REPORT:-/evidence/report.json}"
